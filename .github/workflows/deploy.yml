name: Deploy Launcher to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    # Pages is not required for the Windows machine.
    # Keep this workflow disabled until Pages is enabled in repository settings.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - uses: actions/deploy-pages@v4
        id: deployment
